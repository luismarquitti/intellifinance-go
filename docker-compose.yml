services:
  postgres:
    image: postgres:16-alpine
    container_name: intellifinance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-intellifinance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_secure_postgres_password_123!}
      POSTGRES_DB: ${POSTGRES_DB:-intellifinance}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-intellifinance} -d $${POSTGRES_DB:-intellifinance}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: intellifinance-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning", "--requirepass", "${REDIS_PASSWORD:-dev_secure_redis_password_123!}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dev_secure_redis_password_123!}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
    name: intellifinance-postgres-data
  redis-data:
    name: intellifinance-redis-data
