version: "2"
run:
  go: "1.25"
  timeout: 5m
  tests: true
linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - gosec
    - misspell
    - revive
  settings:
    gosec:
      excludes: [G104]
      severity: medium
      confidence: medium
    govet:
      disable: [fieldalignment]
      enable-all: true
    misspell:
      ignore-rules: [Dividendos] # Portuguese financial category, not an English typo.
    revive:
      rules:
        - name: exported
          arguments: [checkPrivateReceivers]
        - name: blank-imports
        - name: context-as-argument
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: increment-decrement
        - name: var-naming
        - name: receiver-naming
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
